<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viking Collectables & Loot</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0c0f10;
    --panel:#171b1d;
    --panel2:#202527;
    --gold:#c9a34e;
    --gold2:#e2c16b;
    --text:#eee;
    --muted:#92999b;
    --border:#49433a;
    --common:#aaa;
    --uncommon:#63c77b;
    --rare:#5ca8ff;
    --epic:#bd6cff;
    --veryrare:#ff7f50;
    --legendary:#e5ad3e;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,#455057 0,#202628 32%,#0c0f10 70%);
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
}

.container{
    width:min(1200px,94%);
    margin:30px auto;
}

header{
    text-align:center;
    margin-bottom:25px;
}

h1{
    color:var(--gold2);
    font-size:clamp(32px,6vw,58px);
    margin:0;
    text-shadow:3px 3px #000;
}

header p{
    color:var(--muted);
    font-style:italic;
}

.panel{
    background:rgba(23,27,29,.97);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    box-shadow:0 15px 45px #0008;
    margin-bottom:18px;
}

.controls{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

label{
    display:block;
    color:var(--gold2);
    font-weight:bold;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:11px;
    background:#0e1112;
    border:1px solid #555;
    border-radius:6px;
    color:white;
    font-family:inherit;
    font-size:15px;
}

button{
    border:1px solid #a8873f;
    background:#806127;
    color:#fff;
    padding:12px 16px;
    border-radius:6px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#a17c31;
}

.button-row{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.button-row button{
    flex:1;
    min-width:160px;
}

.item-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:12px;
}

.item{
    background:#121617;
    border:1px solid #3c4142;
    border-left:5px solid var(--common);
    border-radius:8px;
    padding:15px;
}

.item.common{border-left-color:var(--common)}
.item.uncommon{border-left-color:var(--uncommon)}
.item.rare{border-left-color:var(--rare)}
.item.very-rare{border-left-color:var(--veryrare)}
.item.epic{border-left-color:var(--epic)}
.item.legendary{border-left-color:var(--legendary)}

.item h3{
    margin:0 0 4px;
    font-size:20px;
}

.meta{
    color:#888;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.value{
    color:#e8c45e;
    font-weight:bold;
    margin-top:8px;
}

.description{
    color:#bbb;
    font-size:14px;
    line-height:1.4;
    margin-top:8px;
}

.materials{
    margin-top:10px;
    padding-top:9px;
    border-top:1px solid #303536;
    color:#aaa;
    font-size:13px;
}

.material{
    display:inline-block;
    background:#272c2d;
    border-radius:4px;
    padding:3px 7px;
    margin:3px 3px 0 0;
}

.badge{
    float:right;
    font-size:11px;
    text-transform:uppercase;
    font-weight:bold;
}

.common .badge{color:var(--common)}
.uncommon .badge{color:var(--uncommon)}
.rare .badge{color:var(--rare)}
.very-rare .badge{color:var(--veryrare)}
.epic .badge{color:var(--epic)}
.legendary .badge{color:var(--legendary)}

.empty{
    padding:35px;
    text-align:center;
    color:#777;
    border:1px dashed #444;
    border-radius:8px;
}

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modal.open{display:flex}

.modal-box{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#191d1f;
    border:1px solid #806b3c;
    border-radius:12px;
    padding:25px;
}

.close{
    float:right;
    background:#333;
    border-color:#555;
}

.loot-result{
    margin-bottom:12px;
    padding:15px;
    background:#101314;
    border-radius:7px;
    border-left:5px solid var(--gold);
}

#status{
    color:#888;
    margin:12px 0;
    font-size:13px;
}

footer{
    text-align:center;
    color:#555;
    padding:20px;
    font-size:12px;
}

@media(max-width:600px){
    .container{width:96%}
    .panel{padding:14px}
}
</style>
</head>

<div class="panel">

                <option value="uncommon">Uncommon</option>
                <option value="rare">Rare</option>
                <option value="very-rare">Very Rare</option>
                <option value="epic">Epic</option>
                <option value="legendary">Legendary</option>
            </select>
        </div>

        <div>
            <label>Sort</label>
            <select id="sort" onchange="renderItems()">
                <option value="name">Name</option>
                <option value="value-low">Value: Low → High</option>
                <option value="value-high">Value: High → Low</option>
                <option value="rarity">Rarity</option>
            </select>
        </div>

    </div>

    <div id="status"></div>

    <div class="button-row">

        <button onclick="generateLoot()">

        </button>

        <button onclick="showRandomTreasure()">

    </div>

</div>


<!-- =========================================================

/* ============================================================
   NORMALISE DATABASE
   ============================================================ */

const db = items.map((i,index)=>({

    id:index,
    name:i[0],
    category:i[1],
    rarity:i[2],
    value:i[3],
    materials:i[4],
    description:i[5]

}));


/* ============================================================
   RARITY ORDER
   ============================================================ */

const rarityOrder = {

    common:1,
    uncommon:2,
    rare:3,
    "very-rare":4,
    epic:5,
    legendary:6

};


/* ============================================================
   CATEGORY DROPDOWN
   ============================================================ */

function populateCategories(){

    const select =
        document.getElementById("category");

    const categories =
        [...new Set(db.map(i=>i.category))]
        .sort();

    categories.forEach(category=>{

        const option =
            document.createElement("option");

        option.value=category;
        option.textContent=category;

        select.appendChild(option);

    });

}


/* ============================================================
   MATERIAL VALUE
   ============================================================ */

function materialTotal(materials){

    return Object.entries(materials)
        .reduce((total,[material,amount])=>{

            return total +
                (materialValues[material] || 1) * amount;

        },0);

}


/* ============================================================
   RENDER ITEMS
   ============================================================ */

function renderItems(){

    const search =
        document.getElementById("search")
        .value.toLowerCase();

    const category =
        document.getElementById("category")
        .value;

    const rarity =
        document.getElementById("rarity")
        .value;

    const sort =
        document.getElementById("sort")
        .value;


    let result =
        db.filter(item=>{

            const matchesSearch =
                item.name.toLowerCase()
                .includes(search);

            const matchesCategory =
                category==="all" ||
                item.category===category;

            const matchesRarity =
                rarity==="all" ||
                item.rarity===rarity;

            return matchesSearch &&
                   matchesCategory &&
                   matchesRarity;

        });


    if(sort==="name")
        result.sort((a,b)=>
            a.name.localeCompare(b.name));

    if(sort==="value-low")
        result.sort((a,b)=>a.value-b.value);

    if(sort==="value-high")
        result.sort((a,b)=>b.value-a.value);

    if(sort==="rarity")
        result.sort((a,b)=>
            rarityOrder[b.rarity]-
            rarityOrder[a.rarity]);


    document.getElementById("status")
        .textContent =
        `${result.length} item${result.length===1?"":"s"} found`;


    const container =
        document.getElementById("items");


    if(!result.length){

        container.innerHTML =
            `<div class="empty">
                No items match your search.
             </div>`;

        return;

    }


    container.innerHTML =
        result.map(item=>itemHTML(item)).join("");

}


/* ============================================================
   ITEM HTML
   ============================================================ */

function itemHTML(item){

    const materialHTML =
        Object.entries(item.materials)
        .filter(([_,amount])=>amount>0)
        .map(([material,amount])=>
            `<span class="material">
                ${material} × ${amount}
             </span>`
        ).join("");


    return `
        <div class="item ${item.rarity}"
             onclick="showItem(${item.id})">

            <span class="badge">
                ${item.rarity.replace("-"," ")}
            </span>

            <h3>${item.name}</h3>

            <div class="meta">
                ${item.category}
            </div>

            <div class="value">
                🪙 ${item.value} silver
            </div>

            <div class="description">
                ${item.description}
            </div>

            <div class="materials">
                Salvage:
                <br>
                ${materialHTML}
            </div>

        </div>
    `;

}


/* ============================================================
   SHOW ITEM
   ============================================================ */

function showItem(id){

    const item=db.find(i=>i.id===id);

    if(!item)return;


    const salvage =
        Object.entries(item.materials)
        .filter(([_,amount])=>amount>0)
        .map(([material,amount])=>
            `<li>${amount} × ${material}</li>`
        ).join("");


    const salvageValue =
        materialTotal(item.materials);


    document.getElementById("modalContent")
        .innerHTML=`

        <h2>${item.name}</h2>

        <p class="meta">
            ${item.category} ·
            ${item.rarity.replace("-"," ")}
        </p>

        <h3 style="color:#e2c16b">
            🪙 ${item.value} silver
        </h3>

        <p>
            ${item.description}
        </p>

        <hr style="border-color:#333">

        <h3>Salvage</h3>

        <ul>
            ${salvage}
        </ul>

        <p style="color:#999">
            Approximate material value:
            ${salvageValue} silver
        </p>

        <div class="button-row">

            <button onclick="sellItem(${item.id})">
                🪙 Sell for ${item.value} silver
            </button>

            <button onclick="salvageItem(${item.id})">
                🔨 Salvage
            </button>

        </div>

    `;


    document.getElementById("modal")
        .classList.add("open");

}


/* ============================================================
   CLOSE MODAL
   ============================================================ */

function closeModal(){

    document.getElementById("modal")
        .classList.remove("open");

}


/* ============================================================
   SELL
   ============================================================ */

function sellItem(id){

    const item=db.find(i=>i.id===id);

    if(!item)return;

    alert(
        `${item.name}\n\nSold for ${item.value} silver.`
    );

    closeModal();

}


/* ============================================================
   SALVAGE
   ============================================================ */

function salvageItem(id){

    const item=db.find(i=>i.id===id);

    if(!item)return;


    const parts =
        Object.entries(item.materials)
        .filter(([_,amount])=>amount>0)
        .map(([material,amount])=>
            `${amount} × ${material}`
        )
        .join("\n");


    alert(
        `${item.name} salvaged:\n\n${parts}`
    );

    closeModal();

}


/* ============================================================
   RANDOM LOOT
   ============================================================ */

function generateLoot(){

    const rarityWeights={

        common:60,
        uncommon:25,
        rare:10,
        "very-rare":4,
        epic:.9,
        legendary:.1

    };


    function randomRarity(){

        const total =
            Object.values(rarityWeights)
            .reduce((a,b)=>a+b,0);

        let roll=Math.random()*total;

        for(const rarity in rarityWeights){

            roll-=rarityWeights[rarity];

            if(roll<=0)
                return rarity;

        }

        return "common";

    }


    const category =
        document.getElementById("category")
        .value;


    let pool=db.filter(item=>
        category==="all" ||
        item.category===category
    );


    if(!pool.length)
        pool=db;


    const rarity=randomRarity();


    let rarityPool =
        pool.filter(i=>i.rarity===rarity);


    if(!rarityPool.length)
        rarityPool=pool;


    const item =
        rarityPool[
            Math.floor(
                Math.random()*rarityPool.length
            )
        ];


    showLootResult(item);

}


/* ============================================================
   RANDOM TREASURE
   ============================================================ */

function showRandomTreasure(){

    const treasureCategories=[
        "Treasure",
        "Everyday",
        "Food",
        "Drink",
        "Magic",
        "Crafting Material"
    ];


    const pool=db.filter(item=>
        treasureCategories.includes(item.category)
    );


    const item=
        pool[
            Math.floor(
                Math.random()*pool.length
            )
        ];


    showLootResult(item);

}


/* ============================================================
   LOOT RESULT
   ============================================================ */

function showLootResult(item){

    document.getElementById("modalContent")
        .innerHTML=`

        <div class="loot-result">

            <span class="badge">
                ${item.rarity.replace("-"," ")}
            </span>

            <h2>
                🎁 ${item.name}
            </h2>

            <p class="meta">
                ${item.category}
            </p>

            <h3 style="color:#e2c16b">
                🪙 ${item.value} silver
            </h3>

            <p>
                ${item.description}
            </p>

            <hr style="border-color:#333">

            <h3>Can be salvaged into:</h3>

            <ul>
                ${
                    Object.entries(item.materials)
                    .filter(([_,amount])=>amount>0)
                    .map(([material,amount])=>
                        `<li>
                            ${amount} × ${material}
                        </li>`
                    ).join("")
                }
            </ul>

        </div>

        <button onclick="generateLoot()">
            🎲 Roll Again
        </button>

    `;


    document.getElementById("modal")
        .classList.add("open");

}


/* ============================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
   ============================================================ */

document.getElementById("modal")
    .addEventListener("click",function(e){

        if(e.target===this)
            closeModal();

    });


/* ============================================================
   START
   ============================================================ */

populateCategories();
renderItems();

</script>
